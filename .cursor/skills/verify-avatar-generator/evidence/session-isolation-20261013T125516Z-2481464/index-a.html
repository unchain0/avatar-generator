<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerador de Avatares RoboHash</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body
    data-confirm-delete="Excluir este avatar?"
    data-confirm-clear="Limpar todos os avatares desta sessão? Isso não pode ser desfeito."
    data-msg-generating="Gerando avatares..."
    data-msg-generated="Avatares gerados."
    data-msg-deleted="Avatar excluído."
    data-msg-cleared="Sessão limpa."
    data-msg-error="Algo deu errado. Tente novamente."
    data-msg-invalid="Informe uma quantidade entre 1 e 50."
>
    <header class="topbar">
        <span class="brand">Gerador de Avatares RoboHash</span>
        <nav class="lang" aria-label="Language">
            <button type="button" data-lang="pt-br" class="active">PT</button>
            <button type="button" data-lang="en">EN</button>
        </nav>
    </header>

    <main class="container">
        <p class="subtitle">Gere avatares de robô a partir de uma biblioteca RoboHash com seed.</p>

        <form id="generateForm" class="controls">
            <div class="control-group">
                <label for="count">Quantidade (1-50)</label>
                <input type="number" id="count" name="count" min="1" max="50" value="1" required>
            </div>
            <div class="control-group">
                <label for="seed">Seed personalizada (opcional)</label>
                <input type="text" id="seed" name="seed" maxlength="128" placeholder="Deixe em branco para uma seed aleatória">
            </div>
            <div class="control-group">
                <label for="set">Conjunto</label>
                <select id="set" name="set">
                    <option value="set1">Set 1</option>
                    <option value="set2">Set 2</option>
                    <option value="set3">Set 3</option>
                    <option value="set4">Set 4</option>
                    <option value="set5">Set 5</option>
                </select>
            </div>
            <div class="control-group">
                <label for="background">Fundo</label>
                <select id="background" name="background">
                    <option value="bg1">BG 1</option>
                    <option value="bg2">BG 2</option>
                    <option value="none">Nenhum</option>
                </select>
            </div>
            <div class="control-group">
                <label for="size">Tamanho</label>
                <select id="size" name="size">
                    <option value="50">50 x 50</option>
                    <option value="100">100 x 100</option>
                    <option value="200">200 x 200</option>
                    <option value="300">300 x 300</option>
                    <option value="400">400 x 400</option>
                    <option value="500">500 x 500</option>
                    <option value="640">640 x 640</option>
                    <option value="800">800 x 800</option>
                    <option value="1024">1024 x 1024</option>
                </select>
            </div>
            <div class="control-group">
                <label for="ttl_days">Expira em (dias)</label>
                <input type="number" id="ttl_days" name="ttl_days" min="1" max="30" value="1">
            </div>
        </form>

        <div class="actions">
            <button type="submit" id="generateBtn" form="generateForm">Gerar</button>
            <button type="button" id="downloadAllBtn">Baixar tudo (ZIP)</button>
            <button type="button" id="clearAllBtn">Limpar tudo</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <section id="gallery" class="gallery">
            
            <article class="avatar-card" data-id="808da491-880b-4971-9f25-bd5636c1904d">
                <img src="/avatar/808da491-880b-4971-9f25-bd5636c1904d" alt="Avatar 0e55924d43a7352f3af1877a534d629568e6fab2a12657acf139bf92843a335d" loading="lazy" width="50" height="50">
                <dl class="meta">
                    <dt>Seed</dt>
                    <dd title="0e55924d43a7352f3af1877a534d629568e6fab2a12657acf139bf92843a335d">0e55924d43a7352f</dd>
                    <dt>Conjunto</dt>
                    <dd>set1</dd>
                    <dt>Fundo</dt>
                    <dd>none</dd>
                    <dt>Expira</dt>
                    <dd>2026-10-14T12:55:23Z</dd>
                </dl>
                <div class="card-actions">
                    <a class="btn" href="/download/808da491-880b-4971-9f25-bd5636c1904d" download>Baixar</a>
                    <button type="button" class="btn danger" data-delete="808da491-880b-4971-9f25-bd5636c1904d">Excluir</button>
                </div>
            </article>
            
        </section>
    </main>

    <script src="/static/app.js" defer></script>
</body>
</html>
