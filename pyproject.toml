[project]
name = "avatar-generator"
version = "0.1.0"
description = "Generate Unique Robot Avatars using RoboHash API"
authors = [
    { name = "Felippe Andrade", email = "unchain0@proton.me" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32.3,<3.0.0",
    "tqdm>=4.67.1,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.6,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "types-requests>=2.32.0.20250328,<3.0.0.0",
    "types-tqdm>=4.67.0.20250417,<5.0.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "pytest>=8.4.2,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "responses>=0.25.8,<1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
