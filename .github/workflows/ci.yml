name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          pr-comment: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --all-targets --lcov --output-path lcov.info
          # Exclusões declaradas em docs/coverage-policy.md.
          cargo llvm-cov report --ignore-filename-regex 'src/main\.rs|/registry/'
          cargo llvm-cov report --json \
            --ignore-filename-regex 'src/main\.rs|/registry/' > coverage.json
          python3 - <<'PY'
          import json
          import sys

          FLOOR_TOTAL = 99.85
          FLOOR_FILE = 99.6
          # Arquivos abaixo de FLOOR_FILE aceitos com justificativa escrita em
          # docs/coverage-policy.md, e o piso próprio de cada um.
          JUSTIFIED = {"security.rs": 99.4}

          with open("coverage.json", encoding="utf-8") as handle:
              data = json.load(handle)["data"][0]

          totals = data["totals"]
          lines = float(totals["lines"]["percent"])
          regions = float(totals["regions"]["percent"])
          print(
              f"Coverage gate: total lines={lines:.2f}% regions={regions:.2f}% "
              f"(floor {FLOOR_TOTAL} each)"
          )

          failed = False
          for name, value in (("lines", lines), ("regions", regions)):
              if value < FLOOR_TOTAL:
                  print(f"total {name} below {FLOOR_TOTAL}%: {value:.2f}", file=sys.stderr)
                  failed = True

          for entry in data["files"]:
              file_lines = float(entry["summary"]["lines"]["percent"])
              file_regions = float(entry["summary"]["regions"]["percent"])
              worst = min(file_lines, file_regions)
              if worst >= FLOOR_FILE:
                  continue
              name = entry["filename"].rsplit("/", 1)[-1]
              justified_floor = JUSTIFIED.get(name)
              if justified_floor is not None and worst >= justified_floor:
                  print(f"file justified in policy: {name} {worst:.2f}%")
                  continue
              print(
                  f"file below {FLOOR_FILE}%: {entry['filename']} "
                  f"lines={file_lines:.2f} regions={file_regions:.2f}",
                  file=sys.stderr,
              )
              failed = True

          sys.exit(1 if failed else 0)
          PY

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies
        run: cargo audit

  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  docker:
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.docker == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max